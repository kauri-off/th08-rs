[package]
name = "th08-audio"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
th08-core = { path = "../th08-core" }
th08-formats = { path = "../th08-formats" }
anyhow = "1.0.104"
cpal = "0.18.2"
hound = "3.5.1"
log = "0.4.34"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"
rustysynth = "1.3.8"

# AAudio LowLatency performance mode (audio.rs `open_stream`); desktop keeps the default build.
[target.'cfg(target_os = "android")'.dependencies]
cpal = { version = "0.18.2", features = ["realtime"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.18.2", features = ["wasm-bindgen"] }
wasm-bindgen-futures = "0.4.79"
