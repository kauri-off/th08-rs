[package]
name = "th08-formats"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
encoding_rs = "0.8"
midly = { version = "0.5.3", default-features = false, features = ["std"] }
# th08.pak decode (pack.rs): pure Rust so wasm32 and Android need no C toolchain; the zstd encoder lives in th08-tools.
ruzstd = "0.8"
sha2 = "0.10"
thiserror = "2"
