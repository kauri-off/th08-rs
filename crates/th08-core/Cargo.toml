[package]
name = "th08-core"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

[lints]
workspace = true

[features]
# Counts NaNs made in logic (nanprobe.rs); off in every shipped build.
nan-probe = []

# Only dependency-free dev-dependencies: a dev-dep on render / audio would bring a second copy of core's types.
[dependencies]
th08-formats = { path = "../th08-formats" }
th08-out = { path = "../th08-out" }
anyhow = "1.0.104"
bitflags = "2.13.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
encoding_rs = "0.8"
libm = "=0.2.16"
log = "0.4.34"

[dev-dependencies]
th08-testkit = { path = "../th08-testkit" }
