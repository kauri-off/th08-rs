[package]
name = "th08-tools"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

[lints]
workspace = true

# Debug tooling: the lib is empty on wasm32 (lib.rs), so its native deps stay off the web build.
[dependencies]
th08 = { path = "../..", features = ["ui-check"] }
th08-audio = { path = "../th08-audio" }
th08-core = { path = "../th08-core" }
th08-formats = { path = "../th08-formats" }
th08-render = { path = "../th08-render" }
th08-replay = { path = "../th08-replay" }
th08-thcrap = { path = "../th08-thcrap" }
th08-ui = { path = "../th08-ui" }
anyhow = "1.0.104"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4.34"
wgpu = "30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
env_logger = "0.11.11"
liblzma = { version = "0.4.9", features = ["static", "parallel"] }
pollster = "1.0.1"
sha2 = "0.10"
serde_json = "1"
# repack: the converter with its zstd encoder (level 19 here; the game decodes with ruzstd).
th08-repack = { path = "../th08-repack", features = ["zstd"] }

[dev-dependencies]
th08-testkit = { path = "../th08-testkit" }
