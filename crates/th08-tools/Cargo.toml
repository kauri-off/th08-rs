[package]
name = "th08-tools"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

[lints]
workspace = true

# Debug tooling: the lib is empty on wasm32 (lib.rs), so its native deps stay off the web build.
[dependencies]
th08 = { path = "../.." }
th08-audio = { path = "../th08-audio" }
th08-core = { path = "../th08-core" }
th08-formats = { path = "../th08-formats" }
th08-render = { path = "../th08-render" }
anyhow = "1.0.104"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4.34"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.11"
liblzma = { version = "0.4.9", features = ["static", "parallel"] }
pollster = "1.0.1"
sha2 = "0.10"
serde_json = "1"
