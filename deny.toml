# cargo deny: advisories, yanked crates, licences and sources; run in CI (check.yml).
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser: unmaintained, no replacement upstream yet; reached only through ab_glyph (egui / winit decorations).
    "RUSTSEC-2026-0192",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[licenses]
version = 2
confidence-threshold = 0.9
# Everything the GPL-3.0-or-later port can link; font licences cover egui's bundled fonts.
allow = [
    "GPL-3.0-or-later", "LGPL-2.1-or-later", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Zlib",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unlicense", "BSL-1.0", "MPL-2.0", "Unicode-3.0",
    "CDLA-Permissive-2.0", "OFL-1.1", "Ubuntu-font-1.0",
]
