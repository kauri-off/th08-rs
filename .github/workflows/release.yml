name: Release builds

# Run from the Actions tab on master (a tag push would start with a cold cache: caches are per ref, and a new tag
# only sees its own and the default branch's). publish = true tags vX.Y.Z (the Cargo.toml version) at this commit
# and creates the release; false only builds the artifacts.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Tag v<Cargo.toml version> at this commit and publish the release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The release tag v<Cargo.toml version>; with publish, it must be new or already on this commit.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Release tag
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          want=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          tag="v$want"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ $PUBLISH == true ]] && at=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            if [[ $at != "$GITHUB_SHA" ]]; then
              echo "::error::$tag already tags $at; bump the version in Cargo.toml"
              exit 1
            fi
          fi

  windows:
    needs: version
    env:
      TH08_RELEASE_TAG: ${{ inputs.publish && needs.version.outputs.tag || '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # +crt-static comes from .cargo/config.toml; icon and version info from build.rs.
      - name: Build
        run: cargo xtask dist --target windows-exe --assets none
      - uses: actions/upload-artifact@v4
        with:
          name: th08-windows
          path: target/dist/th08-*-windows-exe.exe
          if-no-files-found: error

  linux:
    needs: version
    env:
      TH08_RELEASE_TAG: ${{ inputs.publish && needs.version.outputs.tag || '' }}
    runs-on: ubuntu-latest
    # Build against Ubuntu 22.04's glibc 2.35 so the AppImage runs on Ubuntu 22.04+, Debian 12+, Fedora 36+,
    # SteamOS 3; a container keeps that base independent of GitHub's runner image retirements.
    container: ubuntu:22.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config libasound2-dev libudev-dev file zstd
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # git refuses the container's checkout (other owner) without this; xtask reads the version from git describe.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build AppImage
        run: cargo xtask dist --target linux-appimage --assets none
      - uses: actions/upload-artifact@v4
        with:
          name: th08-linux
          path: target/dist/th08-*-linux-appimage.AppImage
          if-no-files-found: error

  android:
    needs: version
    env:
      TH08_RELEASE_TAG: ${{ inputs.publish && needs.version.outputs.tag || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the retired 'tools' package, which sdkmanager no longer has.
          packages: platform-tools
      - name: Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" > /dev/null
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      # Release channel signed with the repository key; without the secrets (forks), the debug channel and its
      # throwaway key, named -debug. Gradle reads the passwords from the properties file; nothing is echoed.
      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.TH08_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.TH08_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TH08_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TH08_ANDROID_KEY_PASSWORD }}
        run: |
          ver=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          if [[ -z $KEYSTORE_B64 || -z $STORE_PASSWORD || -z $KEY_ALIAS || -z $KEY_PASSWORD ]]; then
            echo "::warning::no Android signing secrets: building the debug channel with the throwaway key"
            echo "args=--channel debug --debug-key --out target/dist/th08-$ver-android-apk-debug.apk" >> "$GITHUB_OUTPUT"
            echo "artifact=th08-android-debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          base64 -d <<< "$KEYSTORE_B64" > "$RUNNER_TEMP/th08-release.jks"
          esc() { printf '%s' "${1//\\/\\\\}"; }
          {
            echo "storeFile=$RUNNER_TEMP/th08-release.jks"
            echo "storePassword=$(esc "$STORE_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "keyPassword=$(esc "$KEY_PASSWORD")"
          } > "$RUNNER_TEMP/keystore.properties"
          echo "args=--channel release --keystore $RUNNER_TEMP/keystore.properties" >> "$GITHUB_OUTPUT"
          echo "artifact=th08-android" >> "$GITHUB_OUTPUT"
      - name: Build APK
        env:
          ARGS: ${{ steps.key.outputs.args }}
        # ARGS is split into words on purpose.
        run: cargo xtask dist --target android-apk --assets none $ARGS
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/th08-release.jks" "$RUNNER_TEMP/keystore.properties"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.artifact }}
          path: target/dist/th08-*-android-apk*.apk
          if-no-files-found: error

  release:
    if: inputs.publish
    needs: [version, windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The template comes first, then GitHub's generated commit list; an existing release keeps its notes.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file .github/release-notes.md --generate-notes --target "$SHA"
          gh release upload "$TAG" dist/* --clobber
